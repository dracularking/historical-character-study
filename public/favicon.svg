<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="历史人物人格实验室">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14304b"/>
      <stop offset="1" stop-color="#081626"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddc294"/>
      <stop offset="1" stop-color="#a7854f"/>
    </linearGradient>
  </defs>

  <!-- 深海蓝圆角底 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 古典神庙：三角山墙 -->
  <path d="M32 11 L51 25.5 H13 Z" fill="url(#gold)"/>
  <circle cx="32" cy="22" r="1.7" fill="#0e2236"/>

  <!-- 额枋 -->
  <rect x="11.5" y="26" width="41" height="3.4" rx="0.6" fill="url(#gold)"/>

  <!-- 四根立柱（柱头 + 柱身 + 柱础） -->
  <g fill="url(#gold)">
    <g>
      <rect x="15.4" y="29.2" width="5.2" height="1.7" rx="0.4"/>
      <rect x="16.4" y="30" width="3.2" height="15.6" rx="0.8"/>
      <rect x="15.4" y="45.6" width="5.2" height="1.9" rx="0.4"/>
    </g>
    <g>
      <rect x="24.7" y="29.2" width="5.2" height="1.7" rx="0.4"/>
      <rect x="25.7" y="30" width="3.2" height="15.6" rx="0.8"/>
      <rect x="24.7" y="45.6" width="5.2" height="1.9" rx="0.4"/>
    </g>
    <g>
      <rect x="34.1" y="29.2" width="5.2" height="1.7" rx="0.4"/>
      <rect x="35.1" y="30" width="3.2" height="15.6" rx="0.8"/>
      <rect x="34.1" y="45.6" width="5.2" height="1.9" rx="0.4"/>
    </g>
    <g>
      <rect x="43.4" y="29.2" width="5.2" height="1.7" rx="0.4"/>
      <rect x="44.4" y="30" width="3.2" height="15.6" rx="0.8"/>
      <rect x="43.4" y="45.6" width="5.2" height="1.9" rx="0.4"/>
    </g>
  </g>

  <!-- 两级台阶 -->
  <rect x="11" y="47.6" width="42" height="2.6" rx="0.5" fill="url(#gold)"/>
  <rect x="8.5" y="50.4" width="47" height="3" rx="0.6" fill="url(#gold)"/>
</svg>
